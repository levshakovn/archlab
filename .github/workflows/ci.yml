name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Install dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      
      - name: Lint with flake8
        working-directory: ./backend
        run: |
          flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      
      - name: Check code formatting with black
        working-directory: ./backend
        run: |
          black --check app tests
      
      - name: Check import sorting with isort
        working-directory: ./backend
        run: |
          isort --check-only app tests
      
      - name: Run tests with pytest
        working-directory: ./backend
        run: |
          pytest -v --tb=short

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Run ESLint (check only)
        working-directory: ./frontend
        run: npm run lint:check
      
      - name: Type check with TypeScript
        working-directory: ./frontend
        run: npx tsc --noEmit
      
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./frontend
        run: npm run test:e2e:install

      - name: Run Playwright tests
        working-directory: ./frontend
        run: npm run test:e2e

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install backend dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci
      
      - name: Start backend server
        working-directory: ./backend
        run: |
          uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/backend.log 2>&1 &
          echo $! > /tmp/backend.pid
      
      - name: Wait for backend to be ready
        run: |
          timeout=30
          elapsed=0
          while ! curl -f http://localhost:8000/health > /dev/null 2>&1; do
            if [ $elapsed -ge $timeout ]; then
              echo "Backend failed to start within ${timeout}s"
              cat /tmp/backend.log
              exit 1
            fi
            echo "Waiting for backend... (${elapsed}s)"
            sleep 2
            elapsed=$((elapsed + 2))
          done
          echo "Backend is ready!"
      
      - name: Test backend health endpoint
        run: |
          curl -f http://localhost:8000/health
      
      - name: Test backend root endpoint
        run: |
          curl -f http://localhost:8000/ | grep -q "Welcome to ArchLab" || exit 1
      
      - name: Test backend API endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -X POST http://localhost:8000/api/v1/grade \
            -H "Content-Type: application/json" \
            -d '{"puzzleId":"puzzle-3tier-basic","nodes":{"node-0":{"id":"node-0","serviceType":"ALB","label":"ALB","x":100,"y":100}},"edges":[]}')
          http_code=$(echo "$response" | tail -n1)
          if [ "$http_code" -ne 200 ]; then
            echo "API request failed with HTTP $http_code"
            echo "Response: $response"
            exit 1
          fi
          echo "API endpoint test passed"

